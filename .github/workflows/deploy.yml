name: Deploy SDU Student Life Hub

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      # Optional: run tests if you have them
      # - name: Run Tests
      #   run: npm test

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Dependency Vulnerability Check
        run: npm audit --audit-level=high

      # Simulated step for OWASP ZAP (to be implemented in actual environment)
      - name: Prepare for OWASP ZAP Scanning
        run: |
          echo "Simulating OWASP ZAP security scan..."
          echo "Future step: Integrate zaproxy/action-baseline"

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Replace with actual registry login if pushing to Docker Hub or GHCR
      - name: Simulate Docker Registry Login
        run: echo "Logged into registry"

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Set to true to push the image to a registry
          tags: sdu-student-life-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
